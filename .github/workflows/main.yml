name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Node on GitHub's runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Matches the Node version from your server logs

      # 2. Build the Next.js app inside GitHub Actions
      - name: Build Next.js Frontend
        run: |
          # If your Next.js app is in the root, remove "cd frontend"
          cd frontend 
          npm install
          npm run build

      - name: Prepare target directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/bcnp
            sudo chown $USER:$USER /var/www/bcnp
            sudo chmod 755 /var/www/bcnp

      # 3. Copy code AND the newly generated .next build folder to EC2
      - name: Copy latest code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/var/www/bcnp"
          strip_components: 0

      - name: Install nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt install nginx -y

      - name: Run Deployment Script on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/bcnp/
            chmod +x deploy.sh
            ./deploy.sh
